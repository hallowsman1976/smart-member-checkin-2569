<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121722" media="(prefers-color-scheme: dark)" />
    <title>Smart Member Check-in 2569</title>
    <script>
      // ตั้งธีมก่อนแสดงผล ป้องกันหน้าจอกะพริบสีขาวในโหมดมืด (ค่าเดียวกับ src/lib/theme.ts)
      try {
        var t = localStorage.getItem('smc.theme')
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
